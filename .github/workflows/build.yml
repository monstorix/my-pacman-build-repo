name: build-packages

on:
  schedule:
    # Weekly, Monday 03:17 UTC. Upstream mpv/FFmpeg move constantly, so this
    # keeps the -git packages reasonably fresh without rebuilding every day.
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo namcap
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build packages
        run: sudo -u builder -H env MAKEFLAGS="-j$(nproc)" bash ci/build.sh

      - name: Namcap check
        if: always()
        run: |
          shopt -s nullglob
          pkgs=(artifacts/*.pkg.tar.zst)
          if ((${#pkgs[@]})); then
            namcap "${pkgs[@]}" || true
            for p in packages/*/PKGBUILD; do namcap "$p" || true; done
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish pacman repository branch
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/push-repo.sh
