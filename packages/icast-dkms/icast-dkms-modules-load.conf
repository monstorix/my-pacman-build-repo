# Load the USB bridge at boot. The softdep in
# /usr/lib/modprobe.d/icast-dkms.conf makes modprobe load dvb-usb-icast-fe
# first, so the DVB frontend is registered before udev coldplug probes the
# adapter. Without this the modules are only pulled in by the USB modalias,
# which never happens when the adapter is already plugged in during install.
dvb-usb-icast-smit
