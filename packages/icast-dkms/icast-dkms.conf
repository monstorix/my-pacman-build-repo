# The iCast USB bridge (29df:0001) is handled by dvb-usb-icast-smit. During
# probe it resolves icast_fe_attach() from dvb-usb-icast-fe with dvb_attach(),
# i.e. symbol_request(). Relying on that implicit module load is fragile (and
# fails outright when the symbol is looked up before user space can answer the
# request), so make modprobe load the frontend module first.
softdep dvb-usb-icast-smit pre: dvb-usb-icast-fe
